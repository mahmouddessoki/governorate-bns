<div class="dl-card sm:ms-4">
    <table class="table-fixed ">
        <thead class="pb-5">
            <tr>
                @for (tHead of tableHead(); track $index) {
                <th>
                    <p class="mb-0">
                        {{ tHead }}
                    </p>
                </th>
                }
            </tr>
        </thead>
        <tbody>
            @for (row of tableData(); track $index) {
            <tr class="mb-4">
                @for (head of tableHead(); track $index) {
                <td class="pb-4">
                    @if (head === 'status') {
                    <span class="dl-badge" [ngClass]="{
              'badge-warning': row[head] === 'open',
              'badge-success': row[head] === 'resolved'
            }">
                        {{ row[head] }}
                    </span>
                    } @else {
                    <span>{{ row[head] }}</span>
                    }
                </td>
                }
            </tr>
            }
        </tbody>
    </table>
</div>
